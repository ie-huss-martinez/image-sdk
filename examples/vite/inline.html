<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Workers only from blob: URLs, as the inlined render worker needs, and nothing else from anywhere but this origin. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; worker-src blob:; connect-src 'self'; style-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>image-sdk engine, inlined worker, under a Content Security Policy</title>
  </head>
  <body>
    <main>
      <h1>image-sdk engine, inlined worker, under a Content Security Policy</h1>
      <p>Choose an image to probe and decode it on this device. Nothing is uploaded.</p>
      <label>Image <input id="file" type="file" accept="image/*" /></label>
      <label><input id="self-hosted" type="checkbox" /> Self-hosted worker</label>
      <output id="result" aria-live="polite"></output>
    </main>
    <script type="module" src="/src/engine.ts"></script>
  </body>
</html>
